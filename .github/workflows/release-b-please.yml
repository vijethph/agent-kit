name: "Release B — release-please"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released:      ${{ steps.rp.outputs.release_created }}
      tag:           ${{ steps.rp.outputs.tag_name }}
      version:       ${{ steps.rp.outputs.version }}
      major:         ${{ steps.rp.outputs.major }}
      minor:         ${{ steps.rp.outputs.minor }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that the tag push and the release PR
      # can trigger downstream workflows. See §11.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id:      ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token:         ${{ steps.app-token.outputs.token }}
          config-file:   .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      push:    true
      latest:  true
    permissions:
      contents: read
      packages: write
      id-token: write

  chart:
    needs: [release-please, image]
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/_package-chart.yml
    with:
      chart_version: ${{ needs.release-please.outputs.version }}
      app_version:   ${{ needs.release-please.outputs.version }}
      push:          true
    permissions:
      contents: read
      packages: write
