name: reusable — build image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false
      latest:
        required: false
        type: boolean
        default: false
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      context:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"

    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      digest:
        value: ${{ jobs.build.outputs.digest }}


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image:  ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

#      - uses: actions/create-github-app-token@v3
#        id: app-token
#        with:
#          app-id:       ${{ vars.RELEASE_APP_ID }}
#          private-key:  ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#          owner:        ${{ github.repository_owner }}
#          repositories: playground
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MYLIB_DEPLOY_KEY }}

      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.latest }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context:    ${{ inputs.context }}
          file:       ${{ inputs.dockerfile }}
          platforms:  ${{ inputs.platforms }}
          push:       ${{ inputs.push }}
          load:       ${{ !inputs.push }}
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom:       true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
#          secrets: |
#            gh_token=${{ steps.app-token.outputs.token }}
          secrets: |
            pyoci_pw=${{ secrets.GITHUB_TOKEN }}
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            MYLIB_VERSION=v1.1.3

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
