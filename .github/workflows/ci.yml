name: CI

on:
  push:
  pull_request:

jobs:

# add to ci.yml
  require-release-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          jq -e 'map(startswith("release:")) | any' <<<"$LABELS" \
            || { echo "::error::Add one of release:major, release:minor, release:patch, release:none"; exit 1; }

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uvx ruff format --check .

      - name: Lint
        run: uvx ruff check .
