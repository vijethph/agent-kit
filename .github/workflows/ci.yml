name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:

# add to ci.yml
  require-release-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          jq -e 'map(startswith("release:")) | any' <<<"$LABELS" \
            || { echo "::error::Add one of release:major, release:minor, release:patch, release:none"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read 

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      
#      - name: Configure GitHub App Token
#        uses: actions/create-github-app-token@v3
#        id: app-token
#        with:
#          app-id:       ${{ vars.RELEASE_APP_ID }}
#          private-key:  ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#          owner:        ${{ github.repository_owner }}
#          repositories: playground

#      - name: Authenticate git for github.com
#        env:
#          TOKEN: ${{ steps.app-token.outputs.token }}
#        run: |
#          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"   
 
      - name: Configure SSH
        env:
          KEY: ${{ secrets.MYLIB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked
        env:
          UV_INDEX_PYOCI_USERNAME: ${{ github.actor }}
          UV_INDEX_PYOCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: uvx ruff format --check .

  test-build:
    uses: ./.github/workflows/_build-image.yml
    with:
      version: "v0.6.0" # just a test for building docker image
      push:    true
      latest:  false
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
