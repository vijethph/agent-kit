name: "Release — manual GA"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump relative to the last GA tag"
        type: choice
        options: [major, minor, patch, explicit]
        default: minor
      explicit_version:
        description: "Exact version when bump=explicit, e.g. 2.0.0 (no leading v)"
        type: string
        required: false
      ref:
        description: "Ref to release from"
        type: string
        default: main
      dry_run:
        description: "Compute and build, but do not tag or push"
        type: boolean
        default: true

concurrency:
  group: release-ga
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.bump }}" == "explicit" && -z "${{ inputs.explicit_version }}" ]]; then
            echo "::error::bump=explicit requires explicit_version"; exit 1
          fi
          if [[ -n "${{ inputs.explicit_version }}" ]] \
             && ! [[ "${{ inputs.explicit_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::explicit_version must be MAJOR.MINOR.PATCH"; exit 1
          fi

  version:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag:     ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure CI is green on this ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/status" --jq '.state')
          echo "combined status: $state"
          [[ "$state" == "success" ]] || { echo "::error::CI is not green on ${{ inputs.ref }}"; exit 1; }

      - id: resolve
        run: |
          if [[ "${{ inputs.bump }}" == "explicit" ]]; then
            v="${{ inputs.explicit_version }}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=v$v"    >> "$GITHUB_OUTPUT"
          else
            ./scripts/next-version.sh --mode "${{ inputs.bump }}" --channel ga
          fi

      - name: Refuse to overwrite an existing tag
        run: |
          if git rev-parse "${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.resolve.outputs.tag }} already exists"; exit 1
          fi

  image:
    needs: version
    uses: ./.github/workflows/_build-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      push:    ${{ !inputs.dry_run }}
      latest:  ${{ !inputs.dry_run }}
    permissions: { contents: read, packages: write, id-token: write }

  chart:
    needs: [version, image]
    uses: ./.github/workflows/_package-chart.yml
    with:
      chart_version: ${{ needs.version.outputs.version }}
      app_version:   ${{ needs.version.outputs.version }}
      push:          ${{ !inputs.dry_run }}
    permissions: { contents: read, packages: write }

  publish:
    needs: [version, image, chart]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: production        # add required reviewers here for a human gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: ${{ inputs.ref }}, fetch-depth: 0 }

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --latest
