name: "Release C — label driven"

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.pick.outputs.bump }}
    steps:
      - id: pick
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          bump=""
          for want in major minor patch none; do
            if jq -e --arg l "release:$want" 'index($l)' <<<"$LABELS" >/dev/null; then
              bump="$want"; break
            fi
          done
          if [[ -z "$bump" ]]; then
            echo "::error::PR #${{ github.event.pull_request.number }} has no release:* label. Add release:major|minor|patch|none and re-run."
            exit 1
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  version:
    needs: gate
    if: needs.gate.outputs.bump != 'none'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag:     ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true, ref: main }
      - id: calc
        run: ./scripts/next-version.sh --mode "${{ needs.gate.outputs.bump }}" --channel rc

  # …tag / image / chart jobs identical to Approach A…
